# Reach the host through the QEMU SLIRP gateway at 10.0.2.2. SLIRP's topology
# is fixed, so address statically rather than waiting on DHCP.
CONFIG_NET_QEMU_USER=y
CONFIG_PCIE=y
CONFIG_ETH_E1000=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# qemu_x86 has no entropy device. Not a real RNG.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_COMPILER_OPT="-DWOLFSSL_ACCEPT_WEAK_ENTROPY"

# Key generation is the deep path; see zephyr/README.md on stack sizing.
CONFIG_MAIN_STACK_SIZE=131072
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=262144
CONFIG_ISR_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=2048

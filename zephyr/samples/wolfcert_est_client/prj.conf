CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_BUILTIN=y

CONFIG_WOLFCERT=y
CONFIG_WOLFCERT_EST=y
CONFIG_WOLFCERT_ECC=y

# Reach the host through the QEMU SLIRP gateway at 10.0.2.2. SLIRP's topology
# is fixed, so address statically rather than waiting on DHCP.
CONFIG_NET_QEMU_USER=y
CONFIG_PCIE=y
CONFIG_ETH_E1000=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

CONFIG_POSIX_TIMERS=y
# Not a real RNG. qemu_x86 has no entropy device; a device generating keys
# needs a hardware source instead.
CONFIG_TEST_RANDOM_GENERATOR=y

# Key generation is the deep path; see zephyr/README.md on stack sizing.
CONFIG_MAIN_STACK_SIZE=131072
CONFIG_HW_STACK_PROTECTION=y
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=262144
CONFIG_ISR_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=2048

CONFIG_PRINTK=y

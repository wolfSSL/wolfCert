CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=32768

CONFIG_WOLFCERT_EST=y
CONFIG_WOLFCERT_RSA=y
CONFIG_WOLFCERT_ECC=y
CONFIG_WOLFCERT_ED25519=y

# Reach the host through the QEMU SLIRP gateway at 10.0.2.2. NET_TEST is for
# images with no network device, so it has to come back off here.
CONFIG_NET_TEST=n
CONFIG_NET_QEMU_USER=y
CONFIG_PCIE=y
CONFIG_ETH_E1000=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_TCP=y
# SLIRP's topology is fixed (10.0.2.0/24, gateway 10.0.2.2), so address
# statically and skip DHCP.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_INIT_TIMEOUT=30
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

CONFIG_POSIX_TIMERS=y

# Each enrollment is its own connection; without these the contexts sit in
# TIME_WAIT and the third one fails instantly with none free.
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_TCP_TIME_WAIT_DELAY=0

# A TLS context plus an enrollment does not fit the shared 256 KiB arena a
# second time; wolfSSL_CTX_new then returns NULL and surfaces as a TLS error.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=2097152
CONFIG_HEAP_MEM_POOL_SIZE=1048576

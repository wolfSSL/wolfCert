# SPDX-License-Identifier: GPL-3.0-or-later
name: Nightly

# Re-runs the wolfSSL variant matrix against fresh wolfSSL master and reseeds
# the prefix caches that PR runs restore.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  WOLFSSL_REF: master

jobs:
  matrix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: full canonical, both build systems
          - { name: cmake-full,            os: ubuntu-latest, build: cmake,    wolfssl: full }
          - { name: autoconf-full,         os: ubuntu-latest, build: autoconf, wolfssl: full }
          - { name: cmake-full-opensslextra, os: ubuntu-latest, build: cmake,  wolfssl: full-opensslextra }
          - { name: cmake-full-all,        os: ubuntu-latest, build: cmake,    wolfssl: full-all }
          - { name: cmake-full-floor,      os: ubuntu-latest, build: cmake,    wolfssl: full, wolfssl_ref: v5.9.4-stable }
          # wolfSSL key-alg / crypto variants
          - { name: cmake-est-only-nonrsa, os: ubuntu-latest, build: cmake,    wolfssl: est-only-nonrsa, cmake_extra: -DWOLFCERT_ENABLE_SCEP=OFF }
          - { name: autoconf-est-nonrsa,   os: ubuntu-latest, build: autoconf, wolfssl: est-only-nonrsa, configure_extra: --disable-scep }
          - { name: cmake-ecc-only-est,    os: ubuntu-latest, build: cmake,    wolfssl: ecc-only-est, cmake_extra: -DWOLFCERT_ENABLE_SCEP=OFF }
          - { name: cmake-rsa-min,         os: ubuntu-latest, build: cmake,    wolfssl: rsa-min }
          - { name: cmake-no-des3,         os: ubuntu-latest, build: cmake,    wolfssl: no-des3 }
          - { name: cmake-tls13-only,      os: ubuntu-latest, build: cmake,    wolfssl: tls13-only }
          # ML-DSA per-level gating
          - { name: cmake-mldsa-44off,     os: ubuntu-latest, build: cmake,    wolfssl: mldsa-44off }
          - { name: cmake-mldsa-65off,     os: ubuntu-latest, build: cmake,    wolfssl: mldsa-65off }
          - { name: cmake-mldsa-87off,     os: ubuntu-latest, build: cmake,    wolfssl: mldsa-87off }
          - { name: cmake-no-cryptocb,     os: ubuntu-latest, build: cmake,    wolfssl: no-cryptocb, cmake_extra: "-DWOLFCERT_WERROR=ON -DWOLFCERT_ENABLE_EXAMPLES=ON" }
          # Platform pieces compiled out (transport gate)
          - { name: cmake-no-builtin-transport, os: ubuntu-latest, build: cmake, wolfssl: full, cmake_extra: "-DWOLFCERT_ENABLE_BUILTIN_TRANSPORT=OFF -DWOLFCERT_ENABLE_CLI=OFF -DWOLFCERT_ENABLE_SERVER=OFF" }
          # Constrained builds (unit tests only: single-thread / no-malloc)
          - { name: cmake-static-mem,      os: ubuntu-latest, build: cmake,    wolfssl: static-mem, cmake_extra: -DWOLFCERT_ENABLE_SERVER=OFF, ctest_exclude: "http|tls|roundtrip" }
          # No TLS and no test server over a static pool; stop_idle and get_cert
          # are named since neither matches "tls" or "roundtrip".
          - { name: cmake-no-malloc,       os: ubuntu-latest, build: cmake,    wolfssl: no-malloc,  ctest_exclude: "http|tls|roundtrip|est|stop_idle|get_cert" }
          # macOS reduced subset
          - { name: cmake-full-macos,      os: macos-latest,  build: cmake,    wolfssl: full }
          - { name: cmake-nonrsa-macos,    os: macos-latest,  build: cmake,    wolfssl: est-only-nonrsa, cmake_extra: -DWOLFCERT_ENABLE_SCEP=OFF }
          - { name: cmake-tls13-macos,     os: macos-latest,  build: cmake,    wolfssl: tls13-only }
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential autoconf automake libtool \
              pkg-config python3
          else
            brew install autoconf automake libtool pkg-config
          fi

      - name: Build/restore wolfSSL (${{ matrix.wolfssl }})
        uses: ./.github/actions/build-wolfssl
        with:
          config: ${{ matrix.wolfssl }}
          ref: ${{ matrix.wolfssl_ref || env.WOLFSSL_REF }}
          save: "true"   # nightly (re)seeds the shared cache for PR runs

      - name: Build & test (CMake)
        if: matrix.build == 'cmake'
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          # sigpipe-launcher.sh: make each test ignore SIGPIPE (see the script).
          cmake -S . -B build \
            -DWITH_WOLFSSL="$WOLFSSL_PREFIX" \
            -DWOLFCERT_ENABLE_TESTS=ON \
            -DCMAKE_CROSSCOMPILING_EMULATOR="$PWD/scripts/ci/sigpipe-launcher.sh" \
            ${{ matrix.cmake_extra }}
          cmake --build build -j "$jobs"
          # No args array: "${a[@]}" on an empty array fails set -u on bash 3.2.
          if [ -n "${{ matrix.ctest_exclude }}" ]; then
            ctest --test-dir build -j "$jobs" --output-on-failure \
              -E "${{ matrix.ctest_exclude }}"
          else
            ctest --test-dir build -j "$jobs" --output-on-failure
          fi

      - name: Build & test (autoconf)
        if: matrix.build == 'autoconf'
        shell: bash
        run: |
          set -euo pipefail
          trap '' PIPE   # ignore SIGPIPE: tests write to sockets after peer close
          ./autogen.sh
          ./configure --with-wolfssl="$WOLFSSL_PREFIX" --enable-tests \
            ${{ matrix.configure_extra }}
          make -j "$(nproc)"
          if ! make check; then
            find . -name '*.log' -exec sh -c 'echo "== $1 =="; cat "$1"' _ {} \;
            exit 1
          fi

  negative-config-full:
    name: negative-config (full set, both build systems)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool \
            pkg-config python3
      # Same key as pr.yml, so both share one cache entry.
      - name: Cache negative-config wolfSSL prefixes
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.wolfssl-install
          key: wolfssl-neg-${{ runner.os }}-${{ hashFiles('scripts/ci/build-wolfssl.sh') }}
      - name: Assert every configure gate hard-fails
        run: |
          scripts/ci/assert-configure-fails.sh \
            --wolfssl-base "${{ github.workspace }}/.wolfssl-install"

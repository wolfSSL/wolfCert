# SPDX-License-Identifier: GPL-3.0-or-later
name: PR

# Fast merge gate; the exhaustive matrix, sanitizers and interop run nightly.
on:
  # Push only on the default branches, so a PR does not run twice.
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WOLFSSL_REF: master   # tracked, unpinned

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Canonical full config: CMake (-Werror) + autoconf + sanitizers
          - name: cmake-full-werror
            os: ubuntu-latest
            build: cmake
            wolfssl: full
            cmake_extra: -DWOLFCERT_WERROR=ON -DWOLFCERT_ENABLE_EXAMPLES=ON
          - name: cmake-full-opensslextra
            os: ubuntu-latest
            build: cmake
            wolfssl: full-opensslextra
            cmake_extra: -DWOLFCERT_WERROR=ON
          - name: cmake-full-all
            os: ubuntu-latest
            build: cmake
            wolfssl: full-all
            cmake_extra: -DWOLFCERT_WERROR=ON
          - name: autoconf-full
            os: ubuntu-latest
            build: autoconf
            wolfssl: full
          # The oldest wolfSSL release wolfCert supports
          - name: cmake-full-floor
            os: ubuntu-latest
            build: cmake
            wolfssl: full
            wolfssl_ref: v5.9.4-stable
            cmake_extra: -DWOLFCERT_WERROR=ON
          - name: cmake-full-asan-ubsan
            os: ubuntu-latest
            build: cmake
            wolfssl: full
            cmake_extra: -DCMAKE_BUILD_TYPE=Debug -DWOLFCERT_BUILD_SHARED=OFF
            cflags: -fsanitize=address,undefined -fno-sanitize-recover=all
          # Protocol / server feature gating (all reuse the `full` prefix)
          - name: cmake-est-only
            os: ubuntu-latest
            build: cmake
            wolfssl: full
            cmake_extra: -DWOLFCERT_ENABLE_SCEP=OFF
          - name: cmake-scep-only
            os: ubuntu-latest
            build: cmake
            wolfssl: full
            cmake_extra: -DWOLFCERT_ENABLE_EST=OFF
          - name: cmake-server-off
            os: ubuntu-latest
            build: cmake
            wolfssl: full
            cmake_extra: -DWOLFCERT_ENABLE_SERVER=OFF
            ctest_exclude: roundtrip
          # wolfSSL key-alg / crypto variants
          - name: cmake-est-only-nonrsa
            os: ubuntu-latest
            build: cmake
            wolfssl: est-only-nonrsa
            cmake_extra: -DWOLFCERT_ENABLE_SCEP=OFF
          - name: cmake-ecc-only-est
            os: ubuntu-latest
            build: cmake
            wolfssl: ecc-only-est
            cmake_extra: -DWOLFCERT_ENABLE_SCEP=OFF
          - name: cmake-rsa-min
            os: ubuntu-latest
            build: cmake
            wolfssl: rsa-min
          - name: cmake-no-cryptocb
            os: ubuntu-latest
            build: cmake
            wolfssl: no-cryptocb
            cmake_extra: -DWOLFCERT_WERROR=ON -DWOLFCERT_ENABLE_EXAMPLES=ON
          - name: cmake-no-des3
            os: ubuntu-latest
            build: cmake
            wolfssl: no-des3
          - name: cmake-tls13-only
            os: ubuntu-latest
            build: cmake
            wolfssl: tls13-only
          # ML-DSA per-level gating
          - name: cmake-mldsa-44off
            os: ubuntu-latest
            build: cmake
            wolfssl: mldsa-44off
          - name: cmake-mldsa-65off
            os: ubuntu-latest
            build: cmake
            wolfssl: mldsa-65off
          - name: cmake-mldsa-87off
            os: ubuntu-latest
            build: cmake
            wolfssl: mldsa-87off
          # Platform pieces compiled out (the transport gate)
          - name: cmake-no-builtin-transport
            os: ubuntu-latest
            build: cmake
            wolfssl: full
            # The CLI and server need the built-in transport; the socket tests
            # skip themselves.
            cmake_extra: >-
              -DWOLFCERT_ENABLE_BUILTIN_TRANSPORT=OFF
              -DWOLFCERT_ENABLE_CLI=OFF
              -DWOLFCERT_ENABLE_SERVER=OFF
          # Constrained builds (unit tests only: single-thread / no-malloc)
          - name: cmake-static-mem
            os: ubuntu-latest
            build: cmake
            wolfssl: static-mem
            cmake_extra: -DWOLFCERT_ENABLE_SERVER=OFF
            ctest_exclude: "http|tls|roundtrip"
          - name: cmake-no-malloc
            os: ubuntu-latest
            build: cmake
            wolfssl: no-malloc
            # No TLS and no test server over a static pool; stop_idle and
            # get_cert are named since neither matches "tls" or "roundtrip".
            ctest_exclude: "http|tls|roundtrip|est|stop_idle|get_cert"
          # macOS
          - name: cmake-full-macos
            os: macos-latest
            build: cmake
            wolfssl: full
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential autoconf automake libtool \
              pkg-config python3
          else
            brew install autoconf automake libtool pkg-config
          fi

      - name: Build/restore wolfSSL (${{ matrix.wolfssl }})
        uses: ./.github/actions/build-wolfssl
        with:
          config: ${{ matrix.wolfssl }}
          ref: ${{ matrix.wolfssl_ref || env.WOLFSSL_REF }}
          save: "false"   # PR is restore-only; the nightly reseeds the cache

      - name: Build & test (CMake)
        if: matrix.build == 'cmake'
        shell: bash
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          jobs="$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          extra_cflags=()
          if [ -n "${{ matrix.cflags }}" ]; then
            extra_cflags=(-DCMAKE_C_FLAGS="${{ matrix.cflags }}")
          fi
          cmake -S . -B build \
            -DWITH_WOLFSSL="$WOLFSSL_PREFIX" \
            -DWOLFCERT_ENABLE_TESTS=ON \
            -DCMAKE_CROSSCOMPILING_EMULATOR="$PWD/scripts/ci/sigpipe-launcher.sh" \
            ${{ matrix.cmake_extra }} ${extra_cflags[@]+"${extra_cflags[@]}"}
          cmake --build build -j "$jobs"
          # No args array: "${a[@]}" on an empty array fails set -u on bash 3.2.
          if [ -n "${{ matrix.ctest_exclude }}" ]; then
            ctest --test-dir build -j "$jobs" --output-on-failure \
              -E "${{ matrix.ctest_exclude }}"
          else
            ctest --test-dir build -j "$jobs" --output-on-failure
          fi

      - name: Build & test (autoconf)
        if: matrix.build == 'autoconf'
        shell: bash
        run: |
          set -euo pipefail
          trap '' PIPE   # ignore SIGPIPE: tests write to sockets after peer close
          ./autogen.sh
          ./configure --with-wolfssl="$WOLFSSL_PREFIX" --enable-tests
          make -j "$(nproc)"
          if ! make check; then
            find . -name '*.log' -exec sh -c 'echo "== $1 =="; cat "$1"' _ {} \;
            exit 1
          fi

  header-only:
    name: user_settings header-only build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3
      - name: Build/restore wolfSSL (full)
        uses: ./.github/actions/build-wolfssl
        with:
          config: full
          ref: ${{ env.WOLFSSL_REF }}
          save: "false"   # PR is restore-only; the nightly reseeds the cache
      - name: Configure with a user-supplied user_settings.h
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/us"
          cp examples/user_settings.h.example "$RUNNER_TEMP/us/user_settings.h"
          cmake -S . -B build \
            -DWITH_WOLFSSL="$WOLFSSL_PREFIX" \
            -DWOLFCERT_ENABLE_TESTS=ON \
            -DCMAKE_CROSSCOMPILING_EMULATOR="$PWD/scripts/ci/sigpipe-launcher.sh" \
            -DWOLFCERT_USER_SETTINGS=ON \
            -DWOLFCERT_USER_SETTINGS_DIR="$RUNNER_TEMP/us"
          cmake --build build -j "$(nproc)"
          ctest --test-dir build -j "$(nproc)" --output-on-failure

  no-posix-arm:
    name: header hygiene (freestanding ARM + config resolution)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the bare-metal ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      # Headers only, so no wolfSSL build or prefix cache.
      - name: Check out wolfSSL headers
        run: |
          git clone --depth 1 --branch "$WOLFSSL_REF" \
            https://github.com/wolfSSL/wolfssl "$RUNNER_TEMP/wolfssl"
      - name: Compile every portable source for Cortex-M4
        run: |
          scripts/ci/compile-freestanding.sh \
            --wolfssl-src "$RUNNER_TEMP/wolfssl"
      - name: Assert both entry headers resolve wolfSSL's config identically
        run: |
          scripts/ci/check-config-resolution.sh \
            --wolfssl-src "$RUNNER_TEMP/wolfssl"

  negative-config:
    name: negative-config (fail-fast gates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool \
            pkg-config python3
      # The negative gate does not depend on the wolfSSL commit, so the script
      # hash alone is the key.
      - name: Cache negative-config wolfSSL prefixes
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.wolfssl-install
          key: wolfssl-neg-${{ runner.os }}-${{ hashFiles('scripts/ci/build-wolfssl.sh') }}
      - name: Assert configure hard-fails (both build systems)
        run: |
          scripts/ci/assert-configure-fails.sh \
            --wolfssl-base "${{ github.workspace }}/.wolfssl-install"

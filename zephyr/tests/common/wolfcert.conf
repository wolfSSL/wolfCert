# Shared configuration for the qemu_x86 unit-test images; zephyr/README.md
# explains the networking and stack settings.

CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_BUILTIN=y
CONFIG_WOLFSSL_SETTINGS_FILE="zephyr/wolfssl_user_settings.h"

CONFIG_WOLFCERT=y

# No socket is opened here; NET_TEST keeps QEMU off SLIP.
CONFIG_NET_IPV4=y
CONFIG_NET_TEST=y

# qemu_x86 has no entropy device.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_COMPILER_OPT="-DWOLFSSL_ACCEPT_WEAK_ENTROPY"

# Sized for RSA-2048 key generation.
CONFIG_MAIN_STACK_SIZE=131072
CONFIG_HW_STACK_PROTECTION=y
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=262144

# The x86 defaults are thin once the networking stack is in the image.
CONFIG_ISR_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=2048

CONFIG_PRINTK=y

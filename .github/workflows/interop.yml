# SPDX-License-Identifier: GPL-3.0-or-later
name: Interop

# Third-party EST/SCEP interop. A script exits 77 when its peer failed to
# install, which counts as a neutral pass.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: interop-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  WOLFSSL_REF: master

jobs:
  openssl:
    name: openssl pkcs7/x509 cross-check
    # 26.04 has OpenSSL >= 3.5 for ML-DSA; ubuntu-latest still ships 3.0.
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-wolfcert-cli
        with:
          wolfssl-ref: ${{ env.WOLFSSL_REF }}
      - name: Run openssl_pkcs7_xcheck.sh
        run: |
          set +e
          bash tests/interop/openssl_pkcs7_xcheck.sh; rc=$?
          [ "$rc" -eq 77 ] && { echo "::notice::openssl_pkcs7_xcheck skipped (dep missing)"; exit 0; }
          exit "$rc"

  micromdm-scep:
    name: micromdm/scep
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-wolfcert-cli
        with:
          wolfssl-ref: ${{ env.WOLFSSL_REF }}
      - name: Install micromdm scep
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y scep
      - name: Run scep_micromdm.sh
        run: |
          set +e
          bash tests/interop/scep_micromdm.sh; rc=$?
          [ "$rc" -eq 77 ] && { echo "::notice::micromdm/scep skipped (dep missing)"; exit 0; }
          exit "$rc"

  globalsign-est:
    name: globalsign/est
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-wolfcert-cli
        with:
          wolfssl-ref: ${{ env.WOLFSSL_REF }}
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Install globalsign est (estserver/estclient)
        continue-on-error: true
        run: |
          go install github.com/globalsign/est/cmd/estserver@latest
          go install github.com/globalsign/est/cmd/estclient@latest
      - name: Run est_globalsign.sh
        run: |
          GLOBALSIGN_EST_BIN_DIR="$(go env GOPATH)/bin"
          export GLOBALSIGN_EST_BIN_DIR
          export PATH="$GLOBALSIGN_EST_BIN_DIR:$PATH"
          set +e
          bash tests/interop/est_globalsign.sh; rc=$?
          [ "$rc" -eq 77 ] && { echo "::notice::globalsign/est skipped (dep missing)"; exit 0; }
          exit "$rc"

  libest:
    name: cisco/libest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-wolfcert-cli
        with:
          wolfssl-ref: ${{ env.WOLFSSL_REF }}
      - name: Build Cisco libest from source
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get install -y libssl-dev
          git clone --depth 1 https://github.com/cisco/libest "$RUNNER_TEMP/libest"
          cd "$RUNNER_TEMP/libest"
          # OpenSSL 3.0 removed FIPS_mode()/FIPS_mode_set(), which libest calls;
          # stub them in a -include header, since parens in -D break CFLAGS.
          # libest's configure fails without an explicit safec choice.
          printf '%s\n' '#define FIPS_mode() 0' '#define FIPS_mode_set(x) 0' \
            > "$RUNNER_TEMP/fips_compat.h"
          ./configure --prefix="$RUNNER_TEMP/libest-install" --with-ssl-dir=/usr \
            --disable-safec \
            CFLAGS="-g -O2 -include $RUNNER_TEMP/fips_compat.h"
          make -j "$(nproc)"
          make install
          echo "$RUNNER_TEMP/libest-install/bin" >> "$GITHUB_PATH"
      - name: Run est_libest.sh
        run: |
          set +e
          bash tests/interop/est_libest.sh; rc=$?
          [ "$rc" -eq 77 ] && { echo "::notice::libest skipped (dep missing)"; exit 0; }
          exit "$rc"

  stepca:
    name: smallstep/step-ca
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-wolfcert-cli
        with:
          wolfssl-ref: ${{ env.WOLFSSL_REF }}
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Install step-ca and step CLI
        continue-on-error: true
        run: |
          # step-ca's cgo build links libpcsclite.
          sudo apt-get install -y libpcsclite-dev
          go install github.com/smallstep/certificates/cmd/step-ca@latest
          go install github.com/smallstep/cli/cmd/step@latest
      - name: Run est_stepca.sh
        run: |
          gobin="$(go env GOPATH)/bin"
          export PATH="$gobin:$PATH"
          set +e
          bash tests/interop/est_stepca.sh; rc=$?
          [ "$rc" -eq 77 ] && { echo "::notice::step-ca skipped (dep missing)"; exit 0; }
          exit "$rc"

  wolftpm-fwtpm:
    name: wolfTPM fwTPM (wolfTPM master)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tpm-interop
        with:
          wolfssl-ref: ${{ env.WOLFSSL_REF }}
          wolftpm-ref: master
          save: "true"   # the only job on config wolftpm; pr.yml restores it

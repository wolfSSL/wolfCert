# SPDX-License-Identifier: GPL-3.0-or-later
name: Zephyr

# Builds wolfCert as a Zephyr module, runs the on-target tests under
# qemu_x86, and builds the EST sample for FRDM-MCXN947.
on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

# The event is in the group so a push to main cannot cancel the nightly.
concurrency:
  group: zephyr-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WOLFSSL_REF: master
  ZEPHYR_REF: v4.4.2
  ZEPHYR_SDK: 1.0.1

jobs:
  qemu-x86:
    name: qemu_x86
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Host side: wolfcert-server for the EST gate.
      - name: Build wolfCert CLIs
        uses: ./.github/actions/build-wolfcert-cli
        with:
          wolfssl-ref: ${{ env.WOLFSSL_REF }}

      # Push-to-main and the nightly seed the workspace cache; PR runs and the
      # mcxn job never do, so they cannot race on the key.
      - name: Zephyr workspace
        uses: ./.github/actions/zephyr-workspace
        with:
          zephyr-ref: ${{ env.ZEPHYR_REF }}
          wolfssl-ref: ${{ env.WOLFSSL_REF }}
          sdk-version: ${{ env.ZEPHYR_SDK }}
          toolchain: x86_64-zephyr-elf
          save: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}

      - name: Unit tests
        run: |
          cd "$HOME/zephyrproject"
          # The EST suite and the sample need the host server
          "$HOME/zephyr-venv/bin/python" zephyr/scripts/twister \
            -T "${{ github.workspace }}/zephyr/tests" -e est \
            -p qemu_x86 \
            -x=EXTRA_ZEPHYR_MODULES=${{ github.workspace }} \
            --outdir "$HOME/twister-unit" -vv
          # twister exits 0 when every configuration is filtered out, so name
          # the suites that have to have run.
          "$HOME/zephyr-venv/bin/python" \
            "${{ github.workspace }}/scripts/ci/twister-assert-ran.py" \
            "$HOME/twister-unit/twister.json" \
            wolfcert.unit.smoke wolfcert.unit.keygen wolfcert.unit.csr \
            wolfcert.unit.csr_attrs wolfcert.unit.store \
            wolfcert.unit.parse_negative wolfcert.unit.scep_msg \
            --built-only wolfcert.build.no_builtin_transport \
            wolfcert.build.rsa_only wolfcert.build.scep_only_rsa \
            wolfcert.build.ed448_mldsa

      - name: Start the host EST server
        run: |
          set -euo pipefail
          nohup "$WOLFCERT_BUILD/wolfcert-server" --proto est --listen 0.0.0.0:8443 \
            --basic alice:hunter2 \
            --tls-cert examples/certs/ecc/server-cert.pem \
            --tls-key  examples/certs/ecc/server-key.pem \
            > "$HOME/wolfcert-server.log" 2>&1 &
          for _ in $(seq 20); do
            (echo > /dev/tcp/127.0.0.1/8443) >/dev/null 2>&1 && exit 0
            sleep 0.5
          done
          echo "::error::wolfcert-server did not come up"; exit 1

      - name: EST enrollment gate
        run: |
          cd "$HOME/zephyrproject"
          "$HOME/zephyr-venv/bin/python" zephyr/scripts/twister \
            -T "${{ github.workspace }}/zephyr/tests/wolfcert_est" \
            -T "${{ github.workspace }}/zephyr/samples" \
            -p qemu_x86 -X wolfcert_est_server \
            -x=EXTRA_ZEPHYR_MODULES=${{ github.workspace }} \
            --outdir "$HOME/twister-est" -vv
          "$HOME/zephyr-venv/bin/python" \
            "${{ github.workspace }}/scripts/ci/twister-assert-ran.py" \
            "$HOME/twister-est/twister.json" \
            wolfcert.est.enroll sample.wolfcert.est_client \
            --built-only sample.wolfcert.est_client.custom_ca

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: zephyr-twister-logs
          path: |
            ~/twister-unit/**/handler.log
            ~/twister-unit/**/build.log
            ~/twister-est/**/handler.log
            ~/twister-est/**/build.log
            ~/wolfcert-server.log
          retention-days: 5

  mcxn:
    name: mcxn
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Zephyr workspace
        uses: ./.github/actions/zephyr-workspace
        with:
          zephyr-ref: ${{ env.ZEPHYR_REF }}
          wolfssl-ref: ${{ env.WOLFSSL_REF }}
          sdk-version: ${{ env.ZEPHYR_SDK }}
          toolchain: arm-zephyr-eabi

      - name: FRDM-MCXN947 build
        run: |
          cd "$HOME/zephyrproject"
          "$HOME/zephyr-venv/bin/python" zephyr/scripts/twister --build-only \
            -T "${{ github.workspace }}/zephyr/samples" \
            -p frdm_mcxn947/mcxn947/cpu0 \
            -x=EXTRA_ZEPHYR_MODULES=${{ github.workspace }} \
            --outdir "$HOME/twister-mcxn" -vv
          "$HOME/zephyr-venv/bin/python" \
            "${{ github.workspace }}/scripts/ci/twister-assert-ran.py" \
            "$HOME/twister-mcxn/twister.json" \
            --built-only sample.wolfcert.est_client.frdm_mcxn947

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: zephyr-mcxn-build-logs
          path: ~/twister-mcxn/**/build.log
          retention-days: 5
